name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to create (for example, v0.2.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build application
    environment: github-release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: set NDK
      shell: bash
      run: |
        set -x
        echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Restore keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE }}" > smartautoclicker.jks.asc
        gpg -d --passphrase "${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}" --batch smartautoclicker.jks.asc > smartautoclicker/smartautoclicker.jks

    - name: Build with Gradle
      run: |
        ./gradlew --info \
          -PsigningStorePassword="${{ secrets.SIGNING_STORE_PASSWORD }}" \
          -PsigningKeyAlias="${{ secrets.SIGNING_KEY_ALIAS }}" \
          -PsigningKeyPassword="${{ secrets.SIGNING_KEY_PASSWORD }}" \
          assembleFDroidRelease
      env:
        JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

    - name: Prepare Macrion APKs
      shell: bash
      run: |
        mkdir release-artifacts

        for apk in smartautoclicker/build/outputs/apk/fDroid/release/*.apk; do
          filename="${apk##*/}"

          case "$filename" in
            *-arm64-v8a-release.apk) artifact="macrion-0.2.1-arm64-v8a.apk" ;;
            *-armeabi-v7a-release.apk) artifact="macrion-0.2.1-armeabi-v7a.apk" ;;
            *-x86_64-release.apk) artifact="macrion-0.2.1-x86_64.apk" ;;
            *-x86-release.apk) artifact="macrion-0.2.1-x86.apk" ;;
            *-release.apk) artifact="macrion-0.2.1-universal.apk" ;;
            *) echo "Unexpected APK filename: $filename" >&2; exit 1 ;;
          esac

          cp "$apk" "release-artifacts/$artifact"
        done

    - name: Create draft release with APKs
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag_name }}
        name: Macrion ${{ inputs.tag_name }}
        body_path: .github/release-notes/v0.2.1.md
        draft: true
        files: release-artifacts/*.apk

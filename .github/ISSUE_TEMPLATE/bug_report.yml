name: Bug report
description: Create a report to help us improve
labels: ["bug"]
assignees: []
body:
  - type: input
    id: app-version
    attributes:
      label: Version of Macrion
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation source
      description: Macrion is currently distributed through GitHub releases.
      options:
        - Github
      default: 0
    validations:
      required: false

  - type: input
    id: device-type
    attributes:
      label: Device brand and model
      placeholder: OnePlus 10 Pro
    validations:
      required: false

  - type: input
    id: android-version
    attributes:
      label: Version of your Android OS
      description: Can usually be found under Settings -> About -> Versions
      placeholder: "14"
    validations:
      required: false

  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What kind of bug have you encountered ?
      options:
        - Smart scenario
        - Dumb scenario
        - Backup
        - Other
      default: 0
    validations:
      required: true

  - type: textarea
    id: describe-issue
    attributes:
      label: Describe the issue
      description: Tell us what went wrong and what you expected instead.
      placeholder: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce (optional)
      description: Share the smallest set of steps that consistently triggers the issue, if you know them.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context (optional)
      description: Screenshots, screen recordings, logs, or a minimal scenario backup can help, but are not required.
      placeholder: Drag files here or add anything else that may help.
    validations:
      required: false
